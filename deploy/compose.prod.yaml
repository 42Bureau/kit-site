services:
  kit-site:
    image: ghcr.io/42bureau/kit-site:${IMAGE_TAG:-latest}
    container_name: kit-site
    restart: unless-stopped
    ports:
      - "8101:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s